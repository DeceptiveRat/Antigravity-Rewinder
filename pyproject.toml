[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-rewind"
version = "0.1.0"
description = "Forensic Rewind and Counterfactual Causal Intervention Tool for Google Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SeungSu Kim", email = "0101087ssk@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
agy-rewind = "rewinding.Antigravity_Rewind:main"

[tool.setuptools.packages.find]
where = ["src"]
